name: foldyard · live e2e

# foldyard's live e2es. Two advisory tiers run here:
#   - `live-e2e`: the docker-in-container topology for proxy/box e2es that need a sibling box to
#     reach the test process by container IP (the IN-BOX topology, mirrored).
#   - `lima-host-e2e`: a real Linux HOST — foldyard's default `lima` backend booting a QEMU/KVM
#     VM on the runner (`/dev/kvm` is present on GitHub's x86 Linux runners; Lima's own CI boots
#     VMs the same way), so `machine ensure`, the config-adopt gate, the supervisor and the real
#     `foldyard up` / worktree lifecycle run exactly as on an operator's machine. The phase-0
#     spike that established this (10/10 attempts green, ~2 min per attempt, 2026-09-17) is
#     recorded in docs/linux-support.md. It replaced a `native`-backend job, which exercised no VM.
#
# Split out from foldyard.yml so the fast lint/types/unit suite can run on every push while this
# heavier job stays OPT-IN. The workflow triggers on every push, but the job only runs on `main`
# (the post-merge net), on a manual `workflow_dispatch`, or when a commit message carries
# `[run-e2e]` (the pre-merge opt-in you add when a branch is ready for the full check). On an
# ordinary feature-branch push the job is simply skipped — near-zero cost. Keep it ADVISORY (out of
# branch protection): it drives real containers, so it is the tier most likely to fail for reasons
# that are not the change under review.
on:
  push: # all branches; the job-level `if` decides whether to run
  workflow_dispatch: # allow manual runs

# Least privilege, declared at the workflow level so BOTH jobs (and any added later) inherit it
# rather than the repository default. Neither job needs a write scope: they check out, pull images
# and run pytest — nothing pushes, comments, or publishes. It matters more here than in most
# workflows because `live-e2e` bind-mounts the workspace into a sibling container over the host
# Docker socket, so a token with write scopes would be reachable from inside the code under test.
# (The checkouts also pass `persist-credentials: false`, which keeps the token out of .git/config;
# this is the other half — bounding what the token could do if it did leak.)
permissions:
  contents: read

concurrency:
  group: foldyard-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    name: live e2e (example stack + proxy + box, on Docker)
    # Opt-in (mirrors platform-e2e): main, a manual dispatch, or a `[run-e2e]` commit message.
    if: >-
      github.ref == 'refs/heads/main'
      || contains(github.event.head_commit.message, '[run-e2e]')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Repo-only read: don't leave the GitHub token in .git/config. This job bind-mounts the
      # workspace into a sibling container, so a persisted token would ride into it — and nothing
      # here pushes. persist-credentials: false keeps the checkout but drops the credential.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Warm the host Docker cache, in PARALLEL, so neither the `docker run` below (the uv image)
      # nor the in-test pulls (the api base, the box image, postgres, alpine) wait on a serial pull.
      # python:3.12-slim is the example api's FROM: without it warm, `foldyard up`'s buildkit does a
      # live `load metadata for python:3.12-slim` against Docker Hub, which intermittently 502s and
      # fails the build hard (no buildkit retry). Pre-pulling it (with retry) lets the in-test
      # `docker compose build` resolve the base from the local cache instead of the registry.
      # The box e2es' throwaway base is pinned in tests/e2e_box.py — keep it and the line below
      # in step (a miss costs a serial pull mid-test, not a failure).
      - name: Pre-pull e2e images (parallel)
        run: |
          pull() { for i in 1 2 3 4 5; do docker pull "$1" && return 0; sleep $((i * 5)); done; return 1; }
          pids=()
          for img in \
            ghcr.io/astral-sh/uv:python3.12-bookworm \
            docker.io/library/buildpack-deps:trixie-curl \
            docker.io/library/python:3.12-slim \
            docker.io/library/postgres:16-alpine \
            docker.io/library/alpine:latest; do
            pull "$img" &
            pids+=("$!")
          done
          # Wait on each PID, not a bare `wait`: bare `wait` returns 0 once every child has exited,
          # whatever they exited WITH — so five exhausted retries would warm nothing and still pass
          # the step, leaving the failure to surface as a confusing mid-test build error instead.
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=1
          done
          exit "$rc"

      # The proxy/box live e2es need the test process to run INSIDE a container so a sibling box can
      # reach the in-process proxy/emulator by container IP. Use docker CLI only (no podman), mount
      # the host socket, and keep the repo at the same path so daemon-side bind mounts resolve.
      # IN_DEVBOX=1 is the box signature `config.in_box()` keys on — a preset DOCKER_HOST alone is
      # NOT one (Linux/WSL2 hosts export a socket too). It is what stands the launch gates down
      # here exactly as in the dev box: preflight's fail-closed default-backend block, the
      # config-adopt gate and `machine.ensure` all skip in-box, because there is no VM to manage
      # and nothing host-side to adopt.
      - name: live e2e inside a docker-CLI container
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e FOLDYARD_E2E=1 \
            -e IN_DEVBOX=1 \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            ghcr.io/astral-sh/uv:python3.12-bookworm \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends docker.io curl ca-certificates >/dev/null
              # docker compose v2 plugin (the example-stack e2e shells `docker compose`); the static
              # release binary, dropped into both plugin dirs the docker.io CLI searches.
              for d in /usr/local/lib/docker/cli-plugins /usr/libexec/docker/cli-plugins; do
                mkdir -p "$d"
                curl -fsSL https://github.com/docker/compose/releases/download/v2.30.3/docker-compose-linux-x86_64 \
                  -o "$d/docker-compose"
                chmod +x "$d/docker-compose"
              done
              docker compose version
              uv run --group e2e pytest tests -k e2e -v
            '

  lima-host-e2e:
    name: lima host e2e (example + worktree, on a QEMU/KVM VM)
    # Same opt-in policy as the container topology.
    if: >-
      github.ref == 'refs/heads/main'
      || contains(github.event.head_commit.message, '[run-e2e]')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOLDYARD_E2E: "1"
      FOLDYARD_ENGINE: podman
      MACHINE_BACKEND: lima
      FOLDYARD_STATE_DIR: /tmp/foldyard-state
      LIMA_VERSION: "2.2.0" # the release the rig and the spike validated; bump deliberately
      # XDG_RUNTIME_DIR / DBUS_SESSION_BUS_ADDRESS are appended by the linger step: the `runner`
      # user has no login session, and anything `systemd --user` (the host wall's per-VM scope)
      # needs the user manager. Harmless without the wall; kept so a walled consumer can run here.
    steps:
      # Repo-only read (no push) — keep the token out of .git/config.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0

      # Lima's own runner recipe (lima-vm/lima hack/install-qemu.sh): load the module, then chown
      # the device — `usermod -aG kvm` does not take effect on GHA. Asserting `-w` fails the job in
      # seconds with the reason, not ten minutes in with QEMU's "could not access KVM".
      - name: KVM
        run: |
          set -euo pipefail
          sudo modprobe kvm
          sudo chown "$(id -un)" /dev/kvm
          test -w /dev/kvm
          echo "✓ /dev/kvm writable"

      # ovmf + qemu-system-x86 + qemu-utils is Lima's set; qemu-utils carries qemu-img, which the
      # lima backend needs and `qemu-system-x86-core` does not imply. podman is the host-side
      # ENGINE CLI preflight requires whatever the backend (it drives the VM's forwarded socket);
      # podman-compose is a foldyard dependency, resolved beside the interpreter. nftables is
      # only for a walled consumer (the example declares no wall); cheap, so kept.
      - name: Packages (QEMU, podman CLI, nftables) + Lima
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ovmf qemu-system-x86 qemu-utils podman uidmap slirp4netns nftables jq
          url="https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          curl -fsSL "$url" | sudo tar Cxz /usr/local
          qemu-system-x86_64 --version | head -1
          podman --version
          limactl --version
          limactl info | jq -c .vmTypes

      - name: Enable systemd --user session
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          uid="$(id -u)"
          for _ in $(seq 1 30); do
            test -S "/run/user/$uid/bus" && break
            sleep 1
          done
          {
            echo "XDG_RUNTIME_DIR=/run/user/$uid"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus"
          } >> "$GITHUB_ENV"

      # The VM is created ONCE here, before pytest, from a throwaway copy of the example (preflight
      # refuses the nested project; the launch gate refuses an unadopted checkout with no terminal
      # — `fy config adopt` is the non-interactive path). Every example copy shares the VM name
      # ([machine].name), and the example stack has no bind mounts (its build context ships over
      # the socket), so the tests' own copies drive this VM through the real `foldyard up` —
      # `machine.ensure` finds it running and goes on to the adopt gate + supervisor + compose.
      # DOCKER_HOST is exported so the tests' engine helpers (`podman ps/run` for the in-network
      # probe) reach the VM's forwarded socket: test_e2e.py mirrors it into CONTAINER_HOST.
      - name: Create the machine (fy machine ensure)
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/fyex-machine"
          cp -r example "$dst"
          cd "$dst"
          git init -q && git add -A
          git -c user.email=e2e@foldyard -c user.name=e2e commit -qm init
          uv run --project "$GITHUB_WORKSPACE" foldyard config adopt
          uv run --project "$GITHUB_WORKSPACE" foldyard machine ensure
          sock="$HOME/.lima/foldyard-example/sock/podman.sock"
          test -S "$sock"
          echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
          CONTAINER_HOST="unix://$sock" podman info --format '{{.Host.Arch}} podman {{.Version.Version}} on {{.Host.Distribution.Distribution}} {{.Host.Distribution.Version}}'

      # The host tier: test_e2e.py (the example + worktree stacks) plus the `*_e2e.py` modules that
      # need a real VM (tests/e2e_host.py — verify's negative, the live probes, the machine
      # lifecycle, the walls, the supervisor with the zero-secret rig, the box). Listed by name:
      # `-k e2e` would also pick the proxy/box e2es that need the in-box topology (`live-e2e`).
      # The `e2e` group brings mitmdump for the wall module's `[proxy]`. No pre-pull: the box
      # module recreates the VM (its mount set is init-only), which would discard it anyway.
      - name: Host e2e on the VM
        run: >-
          uv run --group e2e pytest -v
          tests/test_e2e.py
          tests/test_box_e2e.py
          tests/test_host_daemons_e2e.py
          tests/test_machine_e2e.py
          tests/test_probes_e2e.py
          tests/test_verify_e2e.py
          tests/test_wall_e2e.py

      - name: Diagnostics
        if: always()
        run: |
          echo "::group::limactl list"; limactl list || true; echo "::endgroup::"
          echo "::group::podman ps -a"; CONTAINER_HOST="${DOCKER_HOST:-}" podman ps -a || true; echo "::endgroup::"
          echo "::group::supervisor log"; cat "$FOLDYARD_STATE_DIR"/host-supervisor.log 2>/dev/null || echo "(none)"; echo "::endgroup::"
          echo "::group::lima ha.stderr.log"; tail -n 100 "$HOME"/.lima/*/ha.stderr.log 2>/dev/null || true; echo "::endgroup::"

      # Never leave the VM to the runner teardown.
      - name: Teardown
        if: always()
        run: limactl delete -f foldyard-example || true
