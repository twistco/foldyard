# THROWAWAY: facts about podman on ubuntu-26.04 for the docker-free CI. Deleted before the PR.
name: spike podman on 26.04
on:
  push:
    branches: [ci/podman-everywhere]
    paths: [".github/workflows/spike-podman.yml", "spike-marker"]
permissions:
  contents: read
jobs:
  facts-and-in-container:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Facts
        run: |
          id; uname -r; cat /etc/os-release | head -2
          podman --version; buildah --version; which netavark aardvark-dns pasta slirp4netns crun conmon fuse-overlayfs || true
          dpkg -l | grep -E ' (passt|netavark|aardvark-dns|crun|runc|fuse-overlayfs|uidmap) ' | awk '{print $2,$3}' || true
          grep "$USER" /etc/subuid /etc/subgid || true
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>&1 || true
          ls -l /dev/kvm /dev/fuse /dev/net/tun 2>&1 || true
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"; ls -ld /run/user/$(id -u) || true
          loginctl show-user "$USER" 2>&1 | grep -E 'Linger|State' || true
          systemctl --user is-system-running 2>&1 || true
          systemctl --user status podman.socket 2>&1 | head -5 || true
          podman info --format '{{.Host.OCIRuntime.Name}} {{.Host.NetworkBackend}} {{.Host.Security.Rootless}} {{.Store.GraphDriverName}} {{.Host.RootlessNetworkCmd}} {{.Host.CgroupVersion}} {{.Host.CgroupManager}}'
          df -h / /mnt 2>/dev/null; free -g | head -2; nproc
      - name: Rootless run, bridge and DNS
        run: |
          set -x
          time podman run --rm docker.io/library/alpine:latest echo RUN-OK
          podman network create spike
          podman run -d --name a --network spike docker.io/library/alpine:latest sleep 300
          time podman run --rm --network spike docker.io/library/alpine:latest ping -c1 -W5 a
          podman run --rm docker.io/library/alpine:latest wget -qO- https://example.com | head -c 80; echo
          podman rm -f a; podman network rm spike
      - name: Start the rootless API service
        run: |
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          sock="$XDG_RUNTIME_DIR/podman/podman.sock"
          nohup podman system service --time=0 "unix://$sock" > "$RUNNER_TEMP/service.log" 2>&1 &
          for i in $(seq 1 30); do [ -S "$sock" ] && break; sleep 0.2; done
          ls -l "$sock"
          CONTAINER_HOST="unix://$sock" podman --remote info --format 'remote ok {{.Version.Version}}'
          echo "PODMAN_SOCK=$sock" >> "$GITHUB_ENV"
      - name: Live e2e inside a podman-client container, as a box
        run: |
          set +e
          podman run --rm --network podman \
            -v "$PODMAN_SOCK:/var/run/docker.sock" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            -e FOLDYARD_E2E=1 -e IN_DEVBOX=1 \
            -e CONTAINER_HOST=unix:///var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            ghcr.io/astral-sh/uv:python3.12-trixie \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends podman curl ca-certificates git >/dev/null
              git config --global --add safe.directory "$PWD"
              podman --version; podman info --format "server {{.Version.Version}}"
              uv run --group e2e pytest tests -k e2e -v --tb=short -x --co -q | tail -5
              uv run --group e2e pytest tests -k e2e -v --tb=short --maxfail=8
            '
          echo "rc=$?"
          echo '--- service log tail'; tail -20 "$RUNNER_TEMP/service.log"
          exit 0
  stack-straight-from-the-runner:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: fy up on the example, as Tangible's jobs drive it
        env:
          IN_DEVBOX: "1"
        run: |
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          sock="$XDG_RUNTIME_DIR/podman/podman.sock"
          nohup podman system service --time=0 "unix://$sock" > "$RUNNER_TEMP/service.log" 2>&1 &
          for i in $(seq 1 30); do [ -S "$sock" ] && break; sleep 0.2; done
          export CONTAINER_HOST="unix://$sock" DOCKER_HOST="unix://$sock"
          uv tool install --editable .
          set +e
          cd example
          time foldyard up; echo "up rc=$?"
          foldyard ps; echo "ps rc=$?"
          podman ps --format '{{.Names}} {{.Status}}'
          time foldyard build; echo "rebuild rc=$?"
          foldyard down; echo "down rc=$?"
          exit 0
