name: release

# Tag → build → publish to PyPI → GitHub Release. Lives under foldyard/.github/ in the origin
# monorepo so that repo never runs it; in the standalone repo it is the
# .github/workflows/release.yml at the root.
#
# Trusted publishing: PyPI is told to trust THIS workflow in THIS repo (project settings →
# Publishing → add a GitHub publisher: owner twistco, repo foldyard, workflow release.yml,
# environment pypi). No API token is stored anywhere; `uv publish` exchanges the job's OIDC
# token for a short-lived upload token. Build and publish are separate jobs so the publish job
# holds the id-token permission and nothing else, and never runs project code.
on:
  push:
    tags: ["v*"]

# Least privilege by default; the two jobs that need more (publish: id-token, github-release:
# contents write) say so themselves and run no project code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
      # Three cheap assertions, all about the SAME number written in four places. Each has
      # been got wrong: pyproject bumped without uv.lock (the lock records the workspace
      # package's own version, and nothing else notices), and a tag cut while the changelog
      # still said Unreleased. Failing here costs a re-tag; failing after publish costs a
      # version number forever, since PyPI never lets one be reused. See docs/releasing.md.
      - name: Tag, pyproject, uv.lock and CHANGELOG must agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "✗ tag v$tag does not match [project].version = $version — bump pyproject first"
            exit 1
          fi
          locked="$(awk '/^name = "foldyard"$/{getline; print}' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          if [ "$locked" != "$version" ]; then
            echo "✗ uv.lock records foldyard $locked, pyproject says $version — run \`uv lock\`"
            exit 1
          fi
          if ! grep -qE "^## $tag( |$)" CHANGELOG.md; then
            echo "✗ CHANGELOG.md has no '## $tag' section — tag what \`just release\` committed"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # The GitHub Release's notes: this version's CHANGELOG section, extracted HERE (the job that
      # already runs project code, read-only) so the job holding contents:write runs none. Its
      # own artifact: `uv publish` uploads everything in dist/.
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          mkdir notes
          python3 tests/tools/changes.py notes "${GITHUB_REF_NAME#v}" > notes/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: uv publish

  # After PyPI took it, never before: a GitHub Release for a version PyPI refused would advertise
  # one nobody can install. The wheel and sdist ride along, byte-identical to what PyPI has.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "foldyard ${GITHUB_REF_NAME#v}" --notes-file notes/notes.md dist/*
