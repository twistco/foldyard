# foldyard — example consumer config.
#
# A minimal, self-contained stack (Postgres + a FastAPI api) that exercises foldyard
# end-to-end WITHOUT any project-specific machinery — a "bring your own compose stack"
# payload, and the fixture foldyard's own tests run `foldyard up|verify|box` against (CI's
# host tier and the nested-KVM rig; see README.md).
#
# Resolution everywhere is: explicit env var wins → foldyard.local.toml (gitignored,
# per-developer overrides) → this file → built-in default.
# Run foldyard with this dir as the repo root: `cd foldyard/example && foldyard up`
# (foldyard walks up from CWD to the nearest foldyard.toml).
#
# NOT the most locked-down config foldyard can write — read it for the STACK, not the
# credentials. There's no [proxy] and no [machine] firewall here, so box egress is direct:
# unrouted, unobserved, unfiltered. That's deliberate and structural, not simplification —
# the proxy runs on the HOST, and declaring [proxy] makes `fy box up` require a CA only the
# supervisor on the host generates, which would stop this fixture running in-box and in CI's
# box-like container. `foldyard init` writes the locked-down setup for a real project;
# ../example-lima-wall is the worked example of it (VM firewall + enforced allowlist + keyless
# agent). See README.md.

[project]
name = "foldyard-example"
# Container/volume/network prefix (a worktree appends `-<name>`).
prefix = "fyex"
# The app service — target of `foldyard shell` + the browsable-URL hint.
app = "api"
# Compose files in -f order, relative to this dir.
compose = ["compose.yml"]
# The (transitional) dev-VM asset dir — where the gitignored mode mirror (.dev-mode.json)
# lands. "." (the repo root) is also the package default now; shown here for clarity.
dev_vm_dir = "."

# Host-published ports, keyed by the env var the compose file reads. In-container ports
# never move; a worktree adds a deterministic per-name offset for a second stack.
[ports]
API_PORT = 8080
PG_PORT = 5544

# Rootless VM — modest sizing for a throwaway example. The default backend is `lima`
# (concurrent per-project VMs; needs `limactl` alongside podman). `backend = "podman"` is the
# nothing-extra-to-install alternative: one shared machine, no concurrent projects, no VM
# firewall.
# Both are VMs — there is no VM-less backend (ADR-0027).
[machine]
name = "foldyard-example"
cpus = 2
memory_mib = 2048
disk_gib = 20

# The dev box (`foldyard box`). The image is the consumer's; foldyard injects its bits
# (socket, CONTAINER_HOST, the foldyard CLI) at box-up. This image satisfies the minimal
# box contract: an engine client that speaks the socket + git + python/uv.
[box]
image = { dockerfile = "box.Dockerfile", tag = "foldyard-example-box:latest" }
# THE IN-TREE ARTEFACT PATTERN (every real consumer needs it — ../docs/configuration.md `[box]`).
# The box mounts this checkout, so `api/.venv` would be the SAME directory the host's toolchain
# builds into: two kernels, two uids, one dir. `shadow_volumes` masks it with a per-box named
# volume on the VM disk — the box's dependencies never land on the host tree (a package the box
# pulled, compromised or merely different, is never something the host's own python or editor
# can load), the host's never leak into the box, and installs run at VM-disk speed instead of
# the shared mount's. A fresh volume starts EMPTY, so `warmup` fills it at box-up — FROZEN,
# because uv.lock lives on the shared mount and a resolving install would rewrite it as root.
# `env` is not optional with it: the volume is a different filesystem from uv's package cache
# (the default hardlink import fails cross-device), and UV_FROZEN keeps a bare `uv run` from
# re-locking as a side effect of running a test. api/Dockerfile installs from the same lockfile.
shadow_volumes = ["api/.venv"]
warmup = [{ dir = "api", run = "uv sync --frozen" }]
env = { UV_LINK_MODE = "copy", UV_FROZEN = "1" }

# ── Modes, overlays, requirements — the walkthrough in README.md ─────────────────────────
# The fakecred plugin is foldyard's zero-secret stand-in for a real credential mechanism
# (../docs/testing-modes.md): `fakecred` is a credential-granting switch (off | on | user —
# real daemon, TTLs, a capability probe), `fakedep` a dependent behaviour switch that CONSUMES
# it — the same shape as a real consumer's gcp + llm pair, with nothing secret anywhere.
# Declaring the table (even empty) is what loads it.
[plugins.fakecred]

# Mode overlay, pure config: layer compose.feature.yml onto the `-f` chain whenever
# fakedep=on — the api then reports {"feature": "on"} at `/`. See ../docs/compose-overlays.md.
[[overlay]]
file = "compose.feature.yml"
when = { fakedep = "on" }

# Cross-switch requirement: `fy mode fakedep=on` alone is REFUSED with the atomic fix
# (`fy mode fakecred=on fakedep=on`). That row ships INSIDE the fakecred plugin
# (Switch.requires — intrinsic: fakedep exists to consume fakecred), so nothing is declared
# here. When YOUR wiring creates such a coupling — an overlay above routes traffic through
# a credential a different switch grants — declare it beside that overlay as a `[[require]]`
# table instead; schema + the intrinsic-vs-wiring rule: ../docs/configuration.md.
