<svg xmlns="http://www.w3.org/2000/svg" width="1362" height="734" viewBox="99 99 1362 734" fill="none">
  <style>
    text { font-family: "Hanken Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
           fill: #6e7263; }
    .title    { font-family: "Newsreader", Georgia, "Times New Roman", serif;
                font-size: 30px; font-weight: 600; fill: #1a1c16; }
    .tagline  { font-size: 15px; }
    .band     { font-size: 12px; font-weight: 700; fill: #1a1c16; letter-spacing: .06em; }
    .band-sub { font-size: 12px; }
    .card-h   { font-size: 14.5px; font-weight: 700; fill: #1a1c16; }
    .body     { font-size: 12px; }
    .arrow    { font-size: 15px; fill: #9a9d8c; }
    .cap      { font-size: 12px; }
    .cap-b    { font-size: 12px; font-weight: 700; fill: #1a1c16; }
    .col-h    { font-size: 15px; font-weight: 700; fill: #b8923a; }
    .idea-h   { font-size: 12.5px; font-weight: 700; fill: #1a1c16; }
    .idea     { font-size: 11.5px; }
    .frame    { fill: #f6f4ec; stroke: #e1e0d4; }
    .card     { fill: #fff; stroke: #dcdacb; stroke-width: 1.5; }
    .up-card  { fill: #fff; stroke: #b8923a; stroke-width: 1.5; }
    .panel    { fill: #f8f0d8; stroke: #e9d59c; stroke-width: 1.5; }
    .rule     { stroke: #e0cf9a; stroke-width: 1; }
    /* — added by foldyard-isolation-layers.svg — */
    .mono     { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 10.5px; fill: #265629; }
    .tag      { font-size: 10px; font-weight: 700; fill: #b8923a; letter-spacing: .08em; }
    .idea-mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 10.5px; fill: #1a1c16; white-space: pre; }
    .strip    { fill: #fbfaf5; stroke: #dcdacb; stroke-width: 1.5; }
  </style>
  <rect class="frame" x="100" y="100" width="1360" height="732" rx="18"/>

  <!-- header -->
  <text class="title" x="160" y="160">A credential is a row plus a kind</text>
  <text class="tagline" x="160" y="191">Your config says which credential goes where. How the token is made is code that ships with foldyard — never code from your repo.</text>

  <!-- ONE ROW — an [[inject]] entry and what it becomes -->
  <rect class="strip" x="140" y="228" width="1040" height="316" rx="16"/>
  <text class="band" x="160" y="259">ONE ROW</text>
  <text class="band-sub" x="228" y="259">an [[inject]] entry in foldyard.toml — and the four things it becomes</text>

  <rect class="card" x="160" y="278" width="340" height="246" rx="12"/>
  <text class="card-h" x="178" y="305">foldyard.toml</text>
  <text class="idea-mono" x="178" y="331">
    <tspan x="178">[[inject]]</tspan>
    <tspan x="178" dy="17">switch = "github"</tspan>
    <tspan x="178" dy="17">kind = "github-app"</tspan>
    <tspan x="178" dy="17">app_id = "123456"</tspan>
    <tspan x="178" dy="17">installation_id = "7654321"</tspan>
    <tspan x="178" dy="17">repositories = ["my-repo"]</tspan>
    <tspan x="178" dy="17">box_env = { GH_TOKEN = "x" }</tspan>
  </text>
  <text class="body" x="178" y="477">
    <tspan x="178">Committed with the repo, so an edit does nothing</tspan>
    <tspan x="178" dy="16">on your computer until you adopt it.</tspan>
  </text>

  <text class="arrow" x="515" y="341">▶</text>
  <text class="arrow" x="515" y="472">▶</text>

  <rect class="card" x="540" y="278" width="300" height="115" rx="12"/>
  <text class="card-h" x="558" y="305">A switch</text>
  <text class="mono" x="558" y="323">fy mode github=on</text>
  <text class="body" x="558" y="345">
    <tspan x="558">Off by default. Add emergency = true</tspan>
    <tspan x="558" dy="15">and its on level expires by itself.</tspan>
  </text>
  <rect class="card" x="860" y="278" width="300" height="115" rx="12"/>
  <text class="card-h" x="878" y="305">A proxy rule</text>
  <text class="mono" x="878" y="323">api.github.com</text>
  <text class="body" x="878" y="345">
    <tspan x="878">The GitHub kinds fix the host — a minted</tspan>
    <tspan x="878" dy="15">token is never aimed anywhere else.</tspan>
  </text>
  <rect class="card" x="540" y="409" width="300" height="115" rx="12"/>
  <text class="card-h" x="558" y="436">A secret name</text>
  <text class="mono" x="558" y="454">FY_INJECT_GITHUB</text>
  <text class="body" x="558" y="476">
    <tspan x="558">The App's private key, in host.env on your</tspan>
    <tspan x="558" dy="15">computer. Named after the switch, so an</tspan>
    <tspan x="558" dy="15">edit can't point the rule at another secret.</tspan>
  </text>
  <rect class="card" x="860" y="409" width="300" height="115" rx="12"/>
  <text class="card-h" x="878" y="436">A dummy in the box</text>
  <text class="mono" x="878" y="454">GH_TOKEN=x</text>
  <text class="body" x="878" y="476">
    <tspan x="878">Enough for gh to send a header the proxy</tspan>
    <tspan x="878" dy="15">overwrites. fy verify checks it is still</tspan>
    <tspan x="878" dy="15">the dummy.</tspan>
  </text>

  <!-- THE KINDS — the closed set of token protocols -->
  <rect class="strip" x="140" y="568" width="1040" height="224" rx="16"/>
  <text class="band" x="160" y="599">THE KINDS</text>
  <text class="band-sub" x="244" y="599">token protocols — a fixed set of fields each, shipped as foldyard's code</text>

  <rect class="card" x="160" y="618" width="235" height="127" rx="12"/>
  <text class="card-h" x="178" y="645">static</text>
  <text class="mono" x="178" y="663">kind = "static"</text>
  <text class="body" x="178" y="685">
    <tspan x="178">A token you paste once into</tspan>
    <tspan x="178" dy="15">host.env, added as a header or a</tspan>
    <tspan x="178" dy="15">query parameter on one host.</tspan>
    <tspan x="178" dy="15">The default kind.</tspan>
  </text>
  <rect class="card" x="415" y="618" width="235" height="127" rx="12"/>
  <text class="card-h" x="433" y="645">github-app</text>
  <text class="mono" x="433" y="663">kind = "github-app"</text>
  <text class="body" x="433" y="685">
    <tspan x="433">A GitHub App installation token,</tspan>
    <tspan x="433" dy="15">made on your computer from the</tspan>
    <tspan x="433" dy="15">App's private key; good for an</tspan>
    <tspan x="433" dy="15">hour, made again as needed.</tspan>
  </text>
  <rect class="card" x="670" y="618" width="235" height="127" rx="12"/>
  <text class="card-h" x="688" y="645">gh-cli</text>
  <text class="mono" x="688" y="663">kind = "gh-cli"</text>
  <text class="body" x="688" y="685">
    <tspan x="688">Your own gh login's token. It acts</tspan>
    <tspan x="688" dy="15">as you, so it must be an</tspan>
    <tspan x="688" dy="15">emergency switch — on a timer.</tspan>
  </text>
  <rect class="up-card" x="925" y="618" width="235" height="127" rx="12"/>
  <text class="card-h" x="943" y="645">A new protocol</text>
  <text class="mono" x="943" y="663">= a new kind</text>
  <text class="body" x="943" y="685">
    <tspan x="943">Added to foldyard, or shipped as</tspan>
    <tspan x="943" dy="15">an installed plugin. Never a</tspan>
    <tspan x="943" dy="15">command in your config: anything</tspan>
    <tspan x="943" dy="15">that writes the repo could run it.</tspan>
  </text>

  <text class="cap-b" x="160" y="772">Built in beside [[inject]]:<tspan class="cap" dx="4" style="font-weight:400">keyless Claude and Codex (a dummy key in the box, your real one swapped in) and, from a plugin, a GCP metadata emulator.</tspan></text>

  <!-- side panel: the credential owns its scope (ADR-0031) -->
  <rect class="panel" x="1210" y="228" width="210" height="564" rx="12"/>
  <text class="col-h" x="1228" y="258">
    <tspan x="1228">The credential</tspan>
    <tspan x="1228" dy="19">owns its scope</tspan>
  </text>

  <text class="idea-h" x="1228" y="313">1 · One place decides</text>
  <text class="idea" x="1228" y="335">
    <tspan x="1228">A GitHub App's installation</tspan>
    <tspan x="1228" dy="15">permissions are exactly what</tspan>
    <tspan x="1228" dy="15">the box gets. foldyard asks for</tspan>
    <tspan x="1228" dy="15">none and caps none.</tspan>
  </text>

  <text class="idea-h" x="1228" y="424">2 · One App per purpose</text>
  <text class="idea" x="1228" y="446">
    <tspan x="1228">A shared App hands the box</tspan>
    <tspan x="1228" dy="15">every purpose it serves. Want a</tspan>
    <tspan x="1228" dy="15">narrower scope? Make another</tspan>
    <tspan x="1228" dy="15">App, with its own switch.</tspan>
  </text>

  <text class="idea-h" x="1228" y="535">3 · Reported, not hidden</text>
  <text class="idea" x="1228" y="557">
    <tspan x="1228">fy config widenings shows what</tspan>
    <tspan x="1228" dy="15">each App was last seen to</tspan>
    <tspan x="1228" dy="15">grant, flagging write and</tspan>
    <tspan x="1228" dy="15">admin. A change on github.com</tspan>
    <tspan x="1228" dy="15">logs a line and sends a</tspan>
    <tspan x="1228" dy="15">notification.</tspan>
  </text>

  <line class="rule" x1="1228" y1="672" x2="1402" y2="672"/>
  <text class="idea" x="1228" y="698">
    <tspan x="1228">A 403 from GitHub names the</tspan>
    <tspan x="1228" dy="15">permission the App is missing —</tspan>
    <tspan x="1228" dy="15">fix it in the App's settings.</tspan>
  </text>
</svg>
