<svg xmlns="http://www.w3.org/2000/svg" width="1362" height="924" viewBox="99 99 1362 924" fill="none">
  <style>
    text { font-family: "Hanken Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
           fill: #6e7263; }
    .title    { font-family: "Newsreader", Georgia, "Times New Roman", serif;
                font-size: 30px; font-weight: 600; fill: #1a1c16; }
    .tagline  { font-size: 15px; }
    .band     { font-size: 12px; font-weight: 700; fill: #1a1c16; letter-spacing: .06em; }
    .band-sub { font-size: 12px; }
    .legend   { font-size: 11px; font-style: italic; }
    .card-h   { font-size: 14.5px; font-weight: 700; fill: #1a1c16; }
    .body     { font-size: 12px; }
    .mono     { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 10.5px; fill: #265629; }
    .tag      { font-size: 10px; font-weight: 700; fill: #b8923a; letter-spacing: .08em; }
    .ring-h   { font-size: 10.5px; font-weight: 700; fill: #1a1c16; letter-spacing: .06em; }
    .ring-h-vm{ font-size: 10.5px; font-weight: 700; fill: #265629; letter-spacing: .06em; }
    .ring-h-gv{ font-size: 10.5px; font-weight: 700; fill: #8a6a1e; letter-spacing: .06em; }
    .ring     { font-size: 10.5px; }
    .box-h    { font-size: 12px; font-weight: 700; fill: #1a1c16; }
    .pill-t   { font-size: 10.5px; font-weight: 700; fill: #1a1c16; text-anchor: middle; }
    .note     { font-size: 12px; font-weight: 700; fill: #265629; text-anchor: middle; }
    .flow     { font-size: 12.5px; fill: #6e7263; text-anchor: middle; }
    .flow-b   { font-weight: 700; fill: #1a1c16; }
    .col-h    { font-size: 15px; font-weight: 700; fill: #b8923a; }
    .idea-h   { font-size: 12.5px; font-weight: 700; fill: #1a1c16; }
    .idea     { font-size: 11.5px; }
    .idea-mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 10.5px; fill: #1a1c16; white-space: pre; }
    .frame    { fill: #f6f4ec; stroke: #e1e0d4; }
    .card     { fill: #fff; stroke: #dcdacb; stroke-width: 1.5; }
    .fence    { fill: #edf1f3; stroke: #3f6e84; stroke-width: 1.5; }
    .strip    { fill: #fbfaf5; stroke: #dcdacb; stroke-width: 1.5; }
    .host     { fill: #edf1f3; stroke: #3f6e84; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .host-wall{ fill: #edf1f3; stroke: #3f6e84; stroke-width: 4; }
    .vm       { fill: #ebf1e7; stroke: #265629; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .vm-wall  { fill: #ebf1e7; stroke: #265629; stroke-width: 4; }
    .gvisor   { fill: #fbf6e6; stroke: #b8923a; stroke-width: 1.5; }
    .box      { fill: #fff; stroke: #dcdacb; stroke-width: 1.5; }
    .pill     { fill: #fff; stroke: #9a9d8c; stroke-width: 1; }
    .pill-n   { fill: #fbf6e6; stroke: #b8923a; stroke-width: 1.5; }
    .panel    { fill: #f8f0d8; stroke: #e9d59c; stroke-width: 1.5; }
    .rule     { stroke: #e0cf9a; stroke-width: 1; }
  </style>
  <rect class="frame" x="100" y="100" width="1360" height="922" rx="18"/>

  <!-- header -->
  <text class="title" x="160" y="160">Foldyard Isolation Layers</text>
  <text class="tagline" x="160" y="191">The same VM, hardened one ring at a time — each step is one line in foldyard.toml, and the credentials never move.</text>

  <!-- THE CONTAINMENT STACK — what an escape from the box has to get through -->
  <rect class="fence" x="140" y="228" width="1040" height="496" rx="16"/>
  <text class="band" x="160" y="259">THE CONTAINMENT STACK</text>
  <text class="band-sub" x="345" y="259">what an escape from the box has to get through, inside → out · cumulative · dashed = a boundary, thick = one that also refuses egress</text>
  <!-- step 1: Podman VM -->
  <text class="card-h" x="160" y="293">1 · Podman VM</text>
  <text class="mono" x="160" y="311">[machine] backend = "podman"</text>
  <text class="tag" x="160" y="327">MACOS · LINUX</text>
  <rect class="host" x="160" y="340" width="235" height="250" rx="12"/>
  <text class="ring-h" x="172" y="357">HOST</text>
  <text class="ring" x="210" y="357">keys · supervisor · proxy</text>
  <rect class="vm" x="174" y="368" width="207" height="208" rx="10"/>
  <text class="ring-h-vm" x="186" y="385">MACHINE VM</text>
  <text class="ring" x="186" y="399">one machine, shared by every project</text>
  <text class="ring" x="186" y="417">
    <tspan x="186">rootless podman, one engine socket</tspan>
    <tspan x="186" dy="14">mounts only repo + worktrees root</tspan>
    <tspan x="186" dy="14">no firewall — egress is the dial below</tspan>
  </text>
  <rect class="box" x="202" y="468" width="151" height="62" rx="8"/>
  <text class="box-h" x="214" y="488">dev box</text>
  <text class="ring" x="214" y="504">
    <tspan x="214">compose stack · the agent</tspan>
    <tspan x="214" dy="13">and everything they create</tspan>
  </text>
  <rect class="pill" x="202" y="546" width="151" height="20" rx="10"/>
  <text class="pill-t" x="277" y="560">engine socket ▶ the box</text>
  <text class="body" x="160" y="610">
    <tspan x="160">The floor, and already a real fence:</tspan>
    <tspan x="160" dy="15">containers need a Linux kernel, so the</tspan>
    <tspan x="160" dy="15">VM was coming anyway — nothing to</tspan>
    <tspan x="160" dy="15">install beyond podman. An escape lands</tspan>
    <tspan x="160" dy="15">in a throwaway VM, not your computer.</tspan>
    <tspan x="160" dy="15">What it lacks: a VM per project and a</tspan>
    <tspan x="160" dy="15">firewall — traffic can skip the proxy.</tspan>
  </text>
  <!-- step 2: Lima, walled -->
  <text class="card-h" x="415" y="293">2 · Lima + VM firewall</text>
  <text class="mono" x="415" y="311">[machine] firewall = true</text>
  <text class="tag" x="415" y="327">MACOS · LINUX</text>
  <rect class="host" x="415" y="340" width="235" height="250" rx="12"/>
  <text class="ring-h" x="427" y="357">HOST</text>
  <text class="ring" x="465" y="357">keys · supervisor · proxy</text>
  <rect class="vm-wall" x="429" y="368" width="207" height="208" rx="10"/>
  <text class="ring-h-vm" x="441" y="385">MACHINE VM</text>
  <text class="ring" x="441" y="399">one VM per project, side by side</text>
  <text class="ring" x="441" y="417">
    <tspan x="441">hypervisor pinned: vz or qemu</tspan>
    <tspan x="441" dy="14">mounts only repo + worktrees root</tspan>
    <tspan x="441" dy="14">firewall: nftables, installed at boot</tspan>
  </text>
  <rect class="box" x="457" y="468" width="151" height="62" rx="8"/>
  <text class="box-h" x="469" y="488">dev box</text>
  <text class="ring" x="469" y="504">
    <tspan x="469">compose stack · the agent</tspan>
    <tspan x="469" dy="13">and everything they create</tspan>
  </text>
  <rect class="pill" x="457" y="546" width="151" height="20" rx="10"/>
  <text class="pill-t" x="532" y="560">engine socket ▶ the box</text>
  <text class="body" x="415" y="610">
    <tspan x="415">Today's default (lima is the default</tspan>
    <tspan x="415" dy="15">backend). The hypervisor is pinned, and</tspan>
    <tspan x="415" dy="15">root in the guest is boot-time only:</tspan>
    <tspan x="415" dy="15">the firewall goes in at boot, out of the</tspan>
    <tspan x="415" dy="15">box's reach. Traffic that ignores the</tspan>
    <tspan x="415" dy="15">proxy is refused, not let through;</tspan>
    <tspan x="415" dy="15">verify checks both directions.</tspan>
  </text>
  <!-- step 3: + gVisor -->
  <text class="card-h" x="670" y="293">3 · + gVisor</text>
  <text class="tag" x="790" y="292">EXPERIMENTAL</text>
  <text class="mono" x="670" y="311">[machine] runtime = "gvisor"</text>
  <text class="tag" x="670" y="327">MACOS (M1/M2 TOO) · LINUX</text>
  <rect class="host" x="670" y="340" width="235" height="250" rx="12"/>
  <text class="ring-h" x="682" y="357">HOST</text>
  <text class="ring" x="720" y="357">keys · supervisor · proxy</text>
  <rect class="vm-wall" x="684" y="368" width="207" height="208" rx="10"/>
  <text class="ring-h-vm" x="696" y="385">MACHINE VM</text>
  <text class="ring" x="696" y="399">as step 2, plus a second API socket</text>
  <text class="ring" x="696" y="417">
    <tspan x="696">runsc by default, pinned + verified</tspan>
    <tspan x="696" dy="14">wrapper fixes the flags, no override</tspan>
  </text>
  <rect class="gvisor" x="698" y="442" width="179" height="96" rx="9"/>
  <text class="ring-h-gv" x="710" y="459">GVISOR</text>
  <text class="ring" x="762" y="459">the box&#8217;s own kernel</text>
  <rect class="box" x="712" y="468" width="151" height="62" rx="8"/>
  <text class="box-h" x="724" y="488">dev box</text>
  <text class="ring" x="724" y="504">
    <tspan x="724">compose stack · the agent</tspan>
    <tspan x="724" dy="13">and everything they create</tspan>
  </text>
  <rect class="pill-n" x="712" y="546" width="151" height="20" rx="10"/>
  <text class="pill-t" x="787" y="560">narrowed socket ▶ the box</text>
  <text class="body" x="670" y="610">
    <tspan x="670">The box, and everything it creates, runs</tspan>
    <tspan x="670" dy="15">on gVisor's userspace kernel: an exploit</tspan>
    <tspan x="670" dy="15">must beat the Sentry before it reaches</tspan>
    <tspan x="670" dy="15">the kernel with the socket and mounts.</tspan>
    <tspan x="670" dy="15">A VM setting, not a box knob: the</tspan>
    <tspan x="670" dy="15">socket the box holds strips the runtime</tspan>
    <tspan x="670" dy="15">opt-out, so the box cannot leave it.</tspan>
  </text>
  <!-- step 4: + host wall -->
  <text class="card-h" x="925" y="293">4 · + host firewall</text>
  <text class="mono" x="925" y="311">[machine] host_firewall = true</text>
  <text class="tag" x="925" y="327">LINUX ONLY</text>
  <rect class="host-wall" x="925" y="340" width="235" height="250" rx="12"/>
  <text class="ring-h" x="937" y="357">HOST</text>
  <text class="ring" x="975" y="357">nftables on the VM's own slice</text>
  <rect class="vm-wall" x="939" y="368" width="207" height="208" rx="10"/>
  <text class="ring-h-vm" x="951" y="385">MACHINE VM</text>
  <text class="ring" x="951" y="399">as step 3</text>
  <text class="ring" x="951" y="417">
    <tspan x="951">the VM runs in its own systemd slice</tspan>
    <tspan x="951" dy="14">so your computer knows its packets</tspan>
  </text>
  <rect class="gvisor" x="953" y="442" width="179" height="96" rx="9"/>
  <text class="ring-h-gv" x="965" y="459">GVISOR</text>
  <text class="ring" x="1017" y="459">the box&#8217;s own kernel</text>
  <rect class="box" x="967" y="468" width="151" height="62" rx="8"/>
  <text class="box-h" x="979" y="488">dev box</text>
  <text class="ring" x="979" y="504">
    <tspan x="979">compose stack · the agent</tspan>
    <tspan x="979" dy="13">and everything they create</tspan>
  </text>
  <rect class="pill-n" x="967" y="546" width="151" height="20" rx="10"/>
  <text class="pill-t" x="1042" y="560">narrowed socket ▶ the box</text>
  <text class="body" x="925" y="610">
    <tspan x="925">The firewall again, out of the guest's</tspan>
    <tspan x="925" dy="15">reach: your computer matches the VM's</tspan>
    <tspan x="925" dy="15">slice and allows only the proxy ports.</tspan>
    <tspan x="925" dy="15">A guest-kernel exploit that flushes the</tspan>
    <tspan x="925" dy="15">VM firewall still meets this one. You</tspan>
    <tspan x="925" dy="15">install it once; every fy up checks it.</tspan>
    <tspan x="925" dy="15">macOS can't: the VM's net runs as you.</tspan>
  </text>

  <!-- THE WAY OUT — one dial, four positions -->
  <rect class="strip" x="140" y="748" width="1040" height="250" rx="16"/>
  <text class="band" x="160" y="779">THE WAY OUT</text>
  <text class="band-sub" x="266" y="779">egress from the VM — one dial, four positions; grants of every level live on your computer, never in the repo</text>
  <text class="flow" x="660" y="808">the box ▶ VM firewall ▶ host firewall ▶ <tspan class="flow-b">egress proxy — the token is injected here</tspan> ▶ upstream API</text>
  <rect class="card" x="160" y="828" width="235" height="150" rx="12"/>
  <text class="card-h" x="178" y="855">Open</text>
  <text class="mono" x="178" y="872">[proxy] absent</text>
  <text class="body" x="178" y="894">
    <tspan x="178">A clean box: no proxy env, no CA</tspan>
    <tspan x="178" dy="15">mounted. Egress is direct, unlogged,</tspan>
    <tspan x="178" dy="15">and no firewall is possible — it</tspan>
    <tspan x="178" dy="15">needs the proxy as the only way</tspan>
    <tspan x="178" dy="15">out. For a stack that never talks</tspan>
    <tspan x="178" dy="15">out, or one you trust entirely.</tspan>
  </text>
  <rect class="card" x="415" y="828" width="235" height="150" rx="12"/>
  <text class="card-h" x="433" y="855">Observe</text>
  <text class="mono" x="433" y="872">[proxy] · enforce = false</text>
  <text class="body" x="433" y="894">
    <tspan x="433">Everything goes through the proxy</tspan>
    <tspan x="433" dy="15">on your computer: decrypted and</tspan>
    <tspan x="433" dy="15">logged, passthrough hosts as-is.</tspan>
    <tspan x="433" dy="15">Nothing is blocked; the log shows</tspan>
    <tspan x="433" dy="15">what the box reaches for. The token</tspan>
    <tspan x="433" dy="15">is already injected here.</tspan>
  </text>
  <rect class="card" x="670" y="828" width="235" height="150" rx="12"/>
  <text class="card-h" x="688" y="855">Enforce</text>
  <text class="mono" x="688" y="872">enforce = true · "learn"</text>
  <text class="body" x="688" y="894">
    <tspan x="688">A host that isn't granted gets 403</tspan>
    <tspan x="688" dy="15">and is never dialled. "learn", which</tspan>
    <tspan x="688" dy="15">init writes, only records for an</tspan>
    <tspan x="688" dy="15">hour, then enforces by itself. Grants</tspan>
    <tspan x="688" dy="15">live on your computer, never in the</tspan>
    <tspan x="688" dy="15">repo, which the box can write.</tspan>
  </text>
  <rect class="card" x="925" y="828" width="235" height="150" rx="12"/>
  <text class="card-h" x="943" y="855">Fail-closed</text>
  <text class="mono" x="943" y="872">firewall · host_firewall</text>
  <text class="body" x="943" y="894">
    <tspan x="943">Steps 2–4 above: traffic that</tspan>
    <tspan x="943" dy="15">ignores the proxy env is refused in</tspan>
    <tspan x="943" dy="15">the VM, and on Linux on your</tspan>
    <tspan x="943" dy="15">computer too. verify checks the</tspan>
    <tspan x="943" dy="15">refusal AND the permitted path, so</tspan>
    <tspan x="943" dy="15">an outage never reads as enforced.</tspan>
  </text>

  <!-- what stays constant across every posture -->
  <rect class="panel" x="1210" y="228" width="210" height="770" rx="12"/>
  <text class="col-h" x="1228" y="258">What never moves</text>
  <text class="idea-h" x="1228" y="290">
    <tspan x="1228">1 · The credentials</tspan>
  </text>
  <text class="idea" x="1228" y="312">
    <tspan x="1228">Whichever ring you pick, the</tspan>
    <tspan x="1228" dy="15">token is injected at the proxy</tspan>
    <tspan x="1228" dy="15">edge, on your computer. A VM-</tspan>
    <tspan x="1228" dy="15">root escape can flush a firewall;</tspan>
    <tspan x="1228" dy="15">it steals no credential.</tspan>
  </text>
  <text class="idea-h" x="1228" y="402">
    <tspan x="1228">2 · The socket is the</tspan>
    <tspan x="1228" dy="17">design hole</tspan>
  </text>
  <text class="idea" x="1228" y="441">
    <tspan x="1228">The box drives the stack</tspan>
    <tspan x="1228" dy="15">through the engine's own API,</tspan>
    <tspan x="1228" dy="15">and an API can mount whatever</tspan>
    <tspan x="1228" dy="15">its uid can read. Under gVisor</tspan>
    <tspan x="1228" dy="15">it is narrowed to strip the</tspan>
    <tspan x="1228" dy="15">runtime opt-out; a mount</tspan>
    <tspan x="1228" dy="15">allowlist is deferred — the VM</tspan>
    <tspan x="1228" dy="15">holds one project and no key.</tspan>
  </text>
  <text class="idea-h" x="1228" y="576">
    <tspan x="1228">3 · fy verify proves the</tspan>
    <tspan x="1228" dy="17">ring you're in</tspan>
  </text>
  <text class="idea" x="1228" y="615">
    <tspan x="1228">PID 1's mount table, the</tspan>
    <tspan x="1228" dy="15">escape battery, the firewall in</tspan>
    <tspan x="1228" dy="15">both directions — and under</tspan>
    <tspan x="1228" dy="15">gVisor, the kernel the box</tspan>
    <tspan x="1228" dy="15">actually runs on.</tspan>
  </text>
  <line class="rule" x1="1228" y1="693" x2="1402" y2="693"/>
  <text class="idea" x="1228" y="717">
    <tspan x="1228">Cost, measured on macOS:</tspan>
    <tspan x="1228" dy="15">gVisor is ~1.2× on a test suite</tspan>
    <tspan x="1228" dy="15">and 2–4× on sub-second git and</tspan>
    <tspan x="1228" dy="15">lint calls; the firewalls cost</tspan>
    <tspan x="1228" dy="15">nothing at runtime.</tspan>
  </text>
  <line class="rule" x1="1228" y1="795" x2="1402" y2="795"/>
  <text class="idea" x="1228" y="819">
    <tspan x="1228">All of it, in foldyard.toml:</tspan>
  </text>
  <text class="idea-mono" x="1228" y="839">
    <tspan x="1228">[machine]</tspan>
    <tspan x="1228" dy="14">backend   = "lima"</tspan>
    <tspan x="1228" dy="14">firewall  = true</tspan>
    <tspan x="1228" dy="14">runtime   = "gvisor"</tspan>
    <tspan x="1228" dy="14"># Linux only:</tspan>
    <tspan x="1228" dy="14">host_firewall = true</tspan>
    <tspan x="1228" dy="14">[proxy]</tspan>
    <tspan x="1228" dy="14">enforce = true</tspan>
  </text>
</svg>
