<svg xmlns="http://www.w3.org/2000/svg" width="1362" height="1015" viewBox="99 99 1362 1015" fill="none">
  <style>
    text { font-family: "Hanken Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
           fill: #6e7263; }
    .title    { font-family: "Newsreader", Georgia, "Times New Roman", serif;
                font-size: 30px; font-weight: 600; fill: #1a1c16; }
    .tagline  { font-size: 15px; }
    .band     { font-size: 12px; font-weight: 700; fill: #1a1c16; letter-spacing: .06em; }
    .band-yard{ font-size: 12px; font-weight: 700; fill: #265629; letter-spacing: .06em; }
    .band-sub { font-size: 12px; }
    .card-h   { font-size: 14.5px; font-weight: 700; fill: #1a1c16; }
    .body     { font-size: 12px; }
    .arrow    { font-size: 15px; fill: #9a9d8c; }
    .cap-b    { font-size: 12px; font-weight: 700; fill: #1a1c16; }
    .col-lbl  { font-size: 11px; font-weight: 700; fill: #b8923a; letter-spacing: .08em; }
    .col-h    { font-size: 15px; font-weight: 700; fill: #b8923a; }
    .idea-h   { font-size: 12.5px; font-weight: 700; fill: #1a1c16; }
    .idea     { font-size: 11.5px; }
    .mono     { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 10.5px; fill: #265629; }
    .ring     { font-size: 10.5px; }
    .idea-mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                font-size: 10.5px; fill: #1a1c16; white-space: pre; }
    .frame    { fill: #f6f4ec; stroke: #e1e0d4; }
    .card     { fill: #fff; stroke: #dcdacb; stroke-width: 1.5; }
    .fence    { fill: #edf1f3; stroke: #3f6e84; stroke-width: 1.5; }
    .yardfence{ fill: #ebf1e7; stroke: #265629; stroke-width: 2.5; stroke-dasharray: 12.5 12.5; }
    .up-card  { fill: #fff; stroke: #b8923a; stroke-width: 1.5; }
    .panel    { fill: #f8f0d8; stroke: #e9d59c; stroke-width: 1.5; }
    .rule     { stroke: #e0cf9a; stroke-width: 1; }
    .strip    { fill: #fbfaf5; stroke: #dcdacb; stroke-width: 1.5; }
    /* — sequence + status extras (diagram-specs §2.2) — */
    .st-ok    { font-size: 12px; font-weight: 700; fill: #337038; }
    .msg      { stroke: #9a9d8c; stroke-width: 1.5; }
    .life     { stroke: #9a9d8c; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>
  <rect class="frame" x="100" y="100" width="1360" height="1013" rx="18"/>

  <!-- header -->
  <text class="title" x="160" y="160">Credential injection — the token never enters the box</text>
  <text class="tagline" x="160" y="191">The box sends a dummy. The proxy on your computer swaps in a real token on the way out, and answers for itself when it can't.</text>

  <!-- columns: the VM · your computer · the internet -->
  <rect class="yardfence" x="140" y="228" width="340" height="622" rx="16"/>
  <text class="band-yard" x="160" y="259">THE VM</text>
  <text class="band-sub" x="218" y="259">no credentials inside</text>

  <rect class="fence" x="500" y="228" width="460" height="622" rx="16"/>
  <text class="band" x="520" y="259">YOUR COMPUTER</text>
  <text class="band-sub" x="652" y="259">the real secret stays here</text>

  <text class="col-lbl" x="982" y="259">INTERNET</text>

  <!-- lifelines (x = 260 · 615 · 840 · 1080) -->
  <line class="life" x1="260" y1="342" x2="260" y2="834"/>
  <line class="life" x1="615" y1="342" x2="615" y2="834"/>
  <line class="life" x1="840" y1="342" x2="840" y2="834"/>
  <line class="life" x1="1080" y1="342" x2="1080" y2="834"/>

  <rect class="card" x="160" y="278" width="200" height="64" rx="12"/>
  <text class="card-h" x="178" y="304">Dev box</text>
  <text class="ring" x="178" y="324">in the VM · holds only a dummy</text>
  <rect class="card" x="515" y="278" width="200" height="64" rx="12"/>
  <text class="card-h" x="533" y="304">Egress proxy</text>
  <text class="ring" x="533" y="324">kept up by the supervisor</text>
  <rect class="card" x="735" y="278" width="210" height="64" rx="12"/>
  <text class="card-h" x="753" y="304">Token service</text>
  <text class="ring" x="753" y="324">github-app kind, run by the proxy</text>
  <rect class="up-card" x="980" y="278" width="200" height="64" rx="12"/>
  <text class="card-h" x="998" y="304">api.github.com</text>
  <text class="ring" x="998" y="324">upstream</text>

  <!-- SETUP: a note over the proxy and the token service -->
  <text class="band" x="160" y="400">SETUP</text>
  <rect class="strip" x="515" y="362" width="430" height="70" rx="10"/>
  <text class="body" x="531" y="385">
    <tspan x="531">You run <tspan class="cap-b">fy mode github=on</tspan>. The supervisor writes the</tspan>
    <tspan x="531" dy="16">proxy's new settings to a file it re-reads — no restart,</tspan>
    <tspan x="531" dy="16">so connections already open carry on.</tspan>
  </text>

  <!-- EACH REQUEST -->
  <rect x="156" y="452" width="112" height="20" fill="#ebf1e7"/>
  <text class="band" x="160" y="466">EACH REQUEST</text>

  <!-- 1 · box ▶ proxy -->
  <text class="body" x="272" y="482"><tspan class="cap-b">1 · </tspan>gh pr view, carrying</text>
  <text class="body" x="272" y="497">Authorization: token x</text>
  <line class="msg" x1="262" y1="506" x2="606" y2="506"/>
  <text class="arrow" x="604" y="511">▶</text>
  <text class="ring" x="272" y="522">x is the box_env dummy, GH_TOKEN=x</text>

  <!-- 2 · proxy ▶ token service -->
  <text class="body" x="627" y="544"><tspan class="cap-b">2 · </tspan>need a token for</text>
  <text class="body" x="627" y="559">api.github.com</text>
  <line class="msg" x1="617" y1="568" x2="831" y2="568"/>
  <text class="arrow" x="829" y="573">▶</text>
  <text class="ring" x="627" y="584">skipped while the cached one is fresh</text>

  <!-- 3 · token service ◀ -->
  <text class="body" x="627" y="606"><tspan class="cap-b">3 · </tspan>an installation token,</text>
  <text class="body" x="627" y="621">good for 1 hour</text>
  <line class="msg" x1="624" y1="630" x2="838" y2="630"/>
  <text class="arrow" x="616" y="635">◀</text>
  <text class="ring" x="627" y="646">from the App's private key in host.env</text>

  <!-- 4 · proxy ▶ api.github.com -->
  <text class="body" x="627" y="668"><tspan class="cap-b">4 · </tspan>the same request, with</text>
  <text class="body" x="627" y="683">Authorization: Bearer &lt;token&gt;</text>
  <line class="msg" x1="617" y1="692" x2="1071" y2="692"/>
  <text class="arrow" x="1069" y="697">▶</text>
  <text class="ring" x="627" y="708">only that header is changed</text>

  <!-- 5 · api.github.com ◀ -->
  <text class="body" x="627" y="731"><tspan class="cap-b">5 · </tspan>200 OK</text>
  <line class="msg" x1="624" y1="740" x2="1078" y2="740"/>
  <text class="arrow" x="616" y="745">◀</text>

  <!-- 6 · proxy ▶ box -->
  <text class="body" x="272" y="779"><tspan class="cap-b">6 · </tspan>200 OK</text>
  <line class="msg" x1="269" y1="788" x2="613" y2="788"/>
  <text class="arrow" x="261" y="793">◀</text>
  <text class="st-ok" x="272" y="808">✓ the box never saw the token</text>

  <!-- WHEN IT CAN'T INJECT -->
  <rect class="strip" x="140" y="874" width="1040" height="215" rx="16"/>
  <text class="band" x="160" y="905">WHEN IT CAN'T INJECT, IT SAYS WHY</text>
  <text class="band-sub" x="432" y="905">the proxy answers the box itself instead of sending the dummy upstream</text>

  <rect class="card" x="160" y="924" width="235" height="145" rx="12"/>
  <text class="card-h" x="178" y="951">Switch off</text>
  <text class="mono" x="178" y="968">401 from the proxy</text>
  <text class="body" x="178" y="990">
    <tspan x="178">A request carrying the dummy is</tspan>
    <tspan x="178" dy="15">answered, not sent. The message</tspan>
    <tspan x="178" dy="15">names the fix, fy mode github=on,</tspan>
    <tspan x="178" dy="15">to run on your computer — and gh</tspan>
    <tspan x="178" dy="15">prints it.</tspan>
  </text>
  <rect class="card" x="415" y="924" width="235" height="145" rx="12"/>
  <text class="card-h" x="433" y="951">Token service failed</text>
  <text class="mono" x="433" y="968">502 from the proxy</text>
  <text class="body" x="433" y="990">
    <tspan x="433">"foldyard could not mint a</tspan>
    <tspan x="433" dy="15">credential for …" with its reason.</tspan>
    <tspan x="433" dy="15">Remembered for 15 s, so retries</tspan>
    <tspan x="433" dy="15">don't run it again. Fixed on your</tspan>
    <tspan x="433" dy="15">computer: fy host logs.</tspan>
  </text>
  <rect class="card" x="670" y="924" width="235" height="145" rx="12"/>
  <text class="card-h" x="688" y="951">GitHub says 401</text>
  <text class="mono" x="688" y="968">new token, resend once</text>
  <text class="body" x="688" y="990">
    <tspan x="688">The cached token was refused, so a</tspan>
    <tspan x="688" dy="15">fresh one is made and the request</tspan>
    <tspan x="688" dy="15">sent once more. If none can be</tspan>
    <tspan x="688" dy="15">made, the box gets the 502 instead.</tspan>
  </text>
  <rect class="card" x="925" y="924" width="235" height="145" rx="12"/>
  <text class="card-h" x="943" y="951">Two switches, one host</text>
  <text class="mono" x="943" y="968">502 · no credential named</text>
  <text class="body" x="943" y="990">
    <tspan x="943">Allowed if each writes its own</tspan>
    <tspan x="943" dy="15">header: the dummy a request</tspan>
    <tspan x="943" dy="15">carries picks the credential, and</tspan>
    <tspan x="943" dy="15">neither or both is refused. Same</tspan>
    <tspan x="943" dy="15">header? fy mode refuses the second.</tspan>
  </text>

  <!-- why it holds -->
  <rect class="panel" x="1210" y="228" width="210" height="861" rx="12"/>
  <text class="col-h" x="1228" y="258">Why it holds</text>

  <text class="idea-h" x="1228" y="290">1 · Nothing to steal</text>
  <text class="idea" x="1228" y="312">
    <tspan x="1228">The real token lives only in the</tspan>
    <tspan x="1228" dy="15">proxy on your computer and on</tspan>
    <tspan x="1228" dy="15">the wire to GitHub. A</tspan>
    <tspan x="1228" dy="15">compromised box can use it</tspan>
    <tspan x="1228" dy="15">while the switch is on — never</tspan>
    <tspan x="1228" dy="15">read it, or take it away.</tspan>
  </text>

  <text class="idea-h" x="1228" y="426">2 · Pinned to one host</text>
  <text class="idea" x="1228" y="448">
    <tspan x="1228">The GitHub kinds inject only on</tspan>
    <tspan x="1228" dy="15">api.github.com, so the token is</tspan>
    <tspan x="1228" dy="15">never aimed at another host. A</tspan>
    <tspan x="1228" dy="15">git push to github.com carries</tspan>
    <tspan x="1228" dy="15">no token.</tspan>
  </text>

  <text class="idea-h" x="1228" y="547">3 · Same swap for agents</text>
  <text class="idea" x="1228" y="569">
    <tspan x="1228">Keyless Claude and Codex work</tspan>
    <tspan x="1228" dy="15">the same way: a dummy key in</tspan>
    <tspan x="1228" dy="15">the box, your real one added at</tspan>
    <tspan x="1228" dy="15">the provider's API host.</tspan>
  </text>

  <text class="idea-h" x="1228" y="653">4 · Switching cuts nothing</text>
  <text class="idea" x="1228" y="675">
    <tspan x="1228">The proxy re-reads its settings,</tspan>
    <tspan x="1228" dy="15">so turning a switch on or off</tspan>
    <tspan x="1228" dy="15">never drops a download or an</tspan>
    <tspan x="1228" dy="15">agent's stream mid-flight.</tspan>
  </text>

  <line class="rule" x1="1228" y1="752" x2="1402" y2="752"/>
  <text class="idea" x="1228" y="776">The switch, in foldyard.toml:</text>
  <text class="idea-mono" x="1228" y="798">
    <tspan x="1228">[[inject]]</tspan>
    <tspan x="1228" dy="14">switch  = "github"</tspan>
    <tspan x="1228" dy="14">kind    = "github-app"</tspan>
    <tspan x="1228" dy="14">app_id  = "123"</tspan>
    <tspan x="1228" dy="14">installation_id = "456"</tspan>
    <tspan x="1228" dy="14">box_env = {GH_TOKEN="x"}</tspan>
  </text>
  <text class="idea" x="1228" y="890">
    <tspan x="1228">The App's private key goes in</tspan>
    <tspan x="1228" dy="15">host.env, never in this file.</tspan>
  </text>

  <line class="rule" x1="1228" y1="935" x2="1402" y2="935"/>
  <text class="idea" x="1228" y="959">
    <tspan x="1228">fy verify checks that every</tspan>
    <tspan x="1228" dy="15">dummy in the box still holds its</tspan>
    <tspan x="1228" dy="15">dummy value — a real token there</tspan>
    <tspan x="1228" dy="15">is the leak it looks for.</tspan>
  </text>
</svg>
